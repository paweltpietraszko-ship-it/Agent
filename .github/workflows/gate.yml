# Mechaniczna bramka dla pull requestow do main. Uruchamia sie z wersji workflow i skryptow z `main`
# (pull_request_target), wiec branch nie moze ich zmienic. Kod z brancha jest tylko DANYMI (checkout do work/).
# Zmiany w .github/ i harness/ nie moga byc czescia Tasku (bramka je odrzuca) - zmienia je tylko Owner.
name: gate
on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Run gate
        working-directory: work
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          before=$(git merge-base origin/main HEAD)
          [ -n "$before" ] || { echo "::error::brak wspolnej historii z origin/main"; exit 1; }
          head=$(git rev-parse HEAD)
          if python "$GITHUB_WORKSPACE/trusted/harness/bookkeeping_only.py" "$before" "$head"; then
            echo "Zmiana dotyczy wylacznie BOARD.md/ODLOZONE.md - brief niepotrzebny." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          id="${BRANCH#task/}"
          brief=""
          for c in "tasks/${id}.md" "tasks/${id}/brief.md"; do [ -f "$c" ] && brief="$c" && break; done
          [ -n "$brief" ] || { echo "::error::brak briefu: tasks/${id}.md ani tasks/${id}/brief.md"; exit 1; }
          set +e
          python "$GITHUB_WORKSPACE/trusted/harness/backend.py" "$brief" "$before" "$head" "$RUNNER_TEMP/backend_ci.txt" | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          set -e
          { echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then echo "::warning::WYMAGA_DECYZJI - decyzja nalezy do Ownera, nie do CC"; exit 0; fi
          exit "$code"
