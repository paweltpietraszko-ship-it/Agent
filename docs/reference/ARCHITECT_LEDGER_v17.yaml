meta:
  purpose: machine-oriented architecture research ledger for Hybrid Operational System / Agent
  audience: architect_model
  created: 2026-09-17
  status: active
  update_policy: append/update whenever research materially changes architecture hypotheses
  human_readability: secondary

principles:
  P001:
    status: working_strong
    statement: "Global orchestration + local intelligence. Process authority/state stays outside any single LLM."
    basis: "user workflow evidence + multi-agent failure research"
  P002:
    status: working_strong
    statement: "Models should exchange artifacts/evidence, not persuasive conversational context."
    basis: "user workflow: architect -> implementer -> auditor; verifier isolation patterns"
  P003:
    status: working_strong
    statement: "LLM findings/PASS are not source of truth when a deterministic/external oracle exists."
  P004:
    status: working_strong
    statement: "Adopt -> configure -> write. Search current state-of-art before designing custom mechanisms."
  P005:
    status: working_strong
    statement: "Unknown/fragile backend cases must route to bounded AI/HUMAN instead of crash/guess."

hypotheses:
  H001:
    status: working
    statement: "Executor routing should use per-task-family capability profiles, not one global difficulty score."
    falsified_alternative: "single difficulty score 0-100"
    evidence:
      - "IRT-Router: model ability and item difficulty modeled separately"
      - "RouteLMT: expected marginal gain between routes more useful than absolute task difficulty"
    source_urls:
      - "https://arxiv.org/abs/2506.01048"
      - "https://arxiv.org/abs/2604.22520"
    falsifier: "evidence that a simple global score matches/adapts as well under distribution shift"

  H002:
    status: working_strong
    statement: "Criticality/impact of the process is independent from executor confidence/capability and must affect routing."
    rationale: "80% confidence on critical irreversible action is not equivalent to 30% confidence on low-impact reversible action"
    dimensions_candidate:
      - capability_or_uncertainty
      - criticality_or_impact
      - recoverability
      - detectability_or_oracle_strength
    evidence:
      - "cost-sensitive learning-to-defer"
      - "classical FMEA separates severity/occurrence/detectability"
    falsifier: "robust evidence that one calibrated scalar loss preserves all required operational distinctions"

  H003:
    status: working_strong
    statement: "Some routing constraints must be hard eligibility filters before scoring."
    examples:
      - confidentiality
      - authority
      - permissions
      - tool availability
      - forbidden actions
    implication: "high predicted capability cannot override LOCAL_ONLY or OWNER_AUTHORITY"

  H004:
    status: working
    statement: "High-criticality work may require independent verification even when executor capability is high."
    falsifier: "task classes with strong deterministic oracle where duplicate AI verification adds no safety/utility"

  H005:
    status: working_strong
    statement: "Model isolation plus artifact-mediated verification is preferable to debate for this system."
    user_evidence: "current workflow keeps models isolated; code/findings are handoff artifacts"
    research_note: "multi-agent debate can create correlated persuasion/consensus failure"

  H006:
    status: rejected
    statement: "Three models are always better than one."
    reason: "benefit concentrated on difficult tasks; coordination can reduce performance/cost efficiency on easy tasks"

  H007:
    status: rejected
    statement: "LLM auditor PASS can authorize transition by itself."
    reason: "LLM verifiers can accept outputs that deterministic graders reject; audit finding is candidate evidence, not truth"

  H008:
    status: rejected
    statement: "Different model families guarantee independent errors."
    reason: "error correlation persists across strong models/families"

  H009:
    status: working
    statement: "Multi-model verification should be escalation strategy, not mandatory ritual for every task."
    trigger_candidates:
      - high criticality
      - weak/no oracle
      - low capability margin
      - novelty/OOD
      - irreversible side effect

  H010:
    status: working
    statement: "Capability profiles must be versioned by executor/model version + task family + time window."
    reason: "model/tool capability drifts and task distribution changes"

  H011:
    status: working
    statement: "Router must support NO_SAFE_ROUTE as valid result."
    reason: "if all eligible executors are below acceptable risk threshold, forced selection is unsafe"

  H012:
    status: open_question
    statement: "Task-family classification must not reintroduce a central opaque LLM router."
    next_research: "deterministic taxonomy + semantic fallback + learned defer/router approaches"

  H013:
    status: working_strong
    statement: "Criticality should be determined by deterministic policy combining a static process/task risk floor with dynamic request-time signals."
    evidence:
      - "AWS Agentic AI Lens explicitly recommends deterministic risk classification combining static operation class with dynamic request-time signals."
      - "Governed APA formalizes a policy-derived floor guardrail so runtime LLM decisions cannot under-escalate below mandatory policy."
    implication: "LLM may contribute evidence about the case, but must not own the minimum approval/risk tier."
    falsifier: "evidence that opaque model-based risk classification provides equal or better safety/auditability without deterministic policy floor"

  H014:
    status: working_strong
    statement: "Context compression must preserve execution dependencies, not merely semantic relevance."
    evidence:
      - "MAGE reports semantic-similarity memory can fragment decision trajectories; hierarchical execution-state memory improves success while reducing tokens."
      - "ReTree/MAGE preserve source-linked or state-linked paths and support revision from a boundary rather than flat transcript recall."
    implication: "HOT/WARM/COLD is insufficient as a storage policy unless dependency/provenance links determine what is rehydrated."
    falsifier: "controlled evidence that flat recency/semantic retrieval matches dependency-aware state reconstruction on interdependent long-horizon tasks"

  H015:
    status: working
    statement: "Bounded work items should contain the dependency closure required for execution, not globally minimal context."
    evidence:
      - "Coding-agent studies show excess repository context can hurt success/cost, and local edit context is often sufficient."
      - "Runtime-structured decomposition improves retry behavior versus monolithic/static decomposition, but static decomposition alone can be worse when dependencies/failure propagation are mishandled."
      - "ACON shows compression can preserve most performance when optimized against full-context success/failure pairs, implying naive compression is not guaranteed safe."
    implication: "Minimal context is a goal subject to sufficiency; process core/context manager must include active constraints, dependency-linked artifacts, and required evidence."
    falsifier: "evidence that fixed minimal capsules remain sufficient across dependency-heavy tasks without dependency-aware retrieval/state"

architecture_candidate:
  pipeline:
    - work_item
    - hard_eligibility_filters
    - eligible_executors
    - capability_profiles
    - criticality_and_recoverability_policy
    - route
    - executor
    - candidate_result_plus_evidence
    - acceptance_router
    - oracle_or_independent_auditor_or_human
    - authoritative_transition
  invariant: "AI auditor is never above a stronger deterministic/external oracle"
  unknown_handling: "KNOWN->PROGRAM; UNKNOWN_SEMANTIC->AI; UNRESOLVED/AUTHORITY->HUMAN; INVALID/FORBIDDEN->STOP"

research_findings:
  F001:
    finding: "Long autonomous trajectories fail from accumulated local errors, plan anchoring, and poor replanning."
    architectural_effect: "prefer bounded work items and external state/control"
  F002:
    finding: "More deliberation/self-critique is not monotonically beneficial; can increase cost and degrade performance."
    architectural_effect: "prefer better state + clear roles over recursive LLM evaluation"
  F003:
    finding: "Verifier quality has a ceiling; difficult generator errors may not be detectable by another LLM."
    architectural_effect: "use tests/solvers/schemas/real-world evidence whenever available"
  F004:
    finding: "Cross-family verifier diversity can help but is not proof of independence."
    architectural_effect: "measure empirical detection profile by error class"
  F005:
    finding: "Query appearance alone can underpredict real difficulty; OOD and subtle tasks break static routing heuristics."
    architectural_effect: "avoid pseudo-precise manual ambiguity/difficulty scores; calibrate from observed task-family outcomes"
  F006:
    finding: "Risk and coverage trade off: a router that escalates everything can look safe while eliminating utility."
    architectural_effect: "measure human cognitive work removed, not safety alone"
  F007:
    finding: "Risk tier can be computed without an LLM by combining process-defined static risk with deterministic runtime signals."
    architectural_effect: "criticality/risk routing need not create a meta-agent; use policy floor + dynamic rule inputs"
  F008:
    finding: "Flat semantic memory is not enough for long-horizon execution because future relevance follows dependency/state structure, not only topical similarity."
    architectural_effect: "persist dependency/provenance graph or execution-state path; closed tasks leave durable outputs/constraints that can be rehydrated by dependency"
  F009:
    finding: "Less context can outperform full context, but compression is lossy and naive/static decomposition can propagate missing-context failures."
    architectural_effect: "optimize for sufficient context, not smallest context; validate compaction/decomposition boundaries against downstream execution"

empirical_observations_2026_09_16:
  O001:
    source: "E1 bounded semantic extraction/conflict experiment"
    observation: "Deterministic Arm A scored 20/28 with 2 FALSE_CONFIRMED and 2 missed conflicts; DeepSeek 2.5.2 and Gemini 3.6 Flash each scored 28/28 on the same bounded semantic task."
    architectural_effect: "Do not force brittle deterministic logic to solve genuinely semantic interpretation; route bounded semantic residue to AI while backend retains authority."
    caution: "This supports local semantic delegation only; it does not justify model-owned process orchestration."

  O002:
    source: "E2 company identity binding experiment"
    observation: "Frozen PROGRAM->AI_SEMANTIC pipeline scored 32/32: PROGRAM finalized 17 cases; Gemini handled 15/15 semantic cases; FALSE_MATCH=0."
    architectural_effect: "Hybrid routing can outperform either pure deterministic coverage or blanket AI usage when PROGRAM resolves known cases first and AI receives only unresolved semantic residue."

  O003:
    source: "E2 escalation analysis"
    observation: "A human given the same insufficient evidence is not automatically a stronger oracle than AI."
    architectural_effect: "HUMAN escalation should require either additional evidence-gathering capability or real authority/judgment; human review is not a universal safety layer."

  O004:
    source: "E3 learning/governance holdout"
    observation: "Deterministic Arm A classified 16/40 with 24 ABSTAIN and zero unsafe concrete substitutions; Gemini Arm B classified 28/40 with 12 ABSTAIN and zero wrong concrete classes."
    architectural_effect: "Bounded AI can reduce human review materially without increasing observed unsafe concrete decisions when governance remains backend-owned."
    measured_effect: "ABSTAIN/review load reduced by 50% in this holdout (24 -> 12)."

  O005:
    source: "E3 failure-mode distribution"
    observation: "All Gemini Arm B mismatches were ABSTAIN rather than wrong concrete class assignments."
    architectural_effect: "Preferred uncertainty behavior is explicit defer/ABSTAIN, not confident substitution; route design should preserve this failure mode."

  O006:
    source: "E3 governance design"
    observation: "Classifier output remained proposal-only while backend owned action, authority, state, scope, promotion, receipts and supersession semantics."
    architectural_effect: "Separate semantic classification from governance/transition authority. A correct-looking model classification must not directly mutate policy or canonical state."

  O007:
    source: "E3 data-generation attempt with DeepSeek R3"
    observation: "DeepSeek produced a superficially valid class distribution but repeated a B-A-C-E-D class cycle six times, introduced fictitious memory-vs-active coverage, paraphrased an existing trap, and self-audited GO despite contamination."
    architectural_effect: "Complex generation tasks can fail structurally while preserving plausible surface statistics; self-audit is weak evidence. Validation must inspect structure, novelty/contamination and invariants, not only counts or model confidence."

  O008:
    source: "E3 data-generation attempt with Grok"
    observation: "Grok produced the wrong hidden class distribution (A4/B9/C13/D7/E7 instead of target A7/B7/C8/D9/E9), too few abstention traps, omitted required receipt/supersession/rollback traps, leaked parent-company motif contamination, and still self-audited GO."
    architectural_effect: "On complex multi-constraint tasks, plausible output plus self-review can mask global contract violations. Independent artifact-level validation is required."

  O009:
    synthesis: true
    observation: "The main empirical weakness observed was not local fluency but loss of global constraint coherence as task complexity increased."
    architectural_effect: "Keep global constraints/state outside the model; decompose work into bounded items; use explicit invariant checks and independent evidence before transition."

  O010:
    synthesis: true
    observation: "Cross-model diversity helped in bounded semantic tasks, but the decisive safety gain came from role separation and external artifacts/oracles, not model plurality by itself."
    architectural_effect: "Treat multiple models as optional independent executors/auditors selected by risk and task class, never as a voting parliament or source of truth."

  F012:
    finding: "Instruction-channel strength is not uniform: user prose can be overridden by higher-priority system/developer/tool-enforced constraints; critical behavioral guarantees should therefore not live only in natural-language user prompts or skills."
    architectural_effect: "Place critical invariants outside the model where possible: backend policy/hard gates first, required tool+schema second, skill/instruction guidance below that. Treat plain user prose as advisory unless the system design enforces it."
    basis: "direct product behavior observed in current workflow + tool/schema enforcement properties"

