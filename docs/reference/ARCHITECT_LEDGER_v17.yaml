architecture_component_fit_method_2026_09_17:
  status: working_strong
  principle: "Move from general architectural discussion to evidence-based component selection: identify a promising architecture element, then test whether it satisfies the system's already-recorded requirements before adopting, configuring, reducing, or rewriting it."
  method:
    - "Start from explicit product/architecture requirements, not from a favorite technology or previous project."
    - "Select one concrete existing component/pattern whose properties appear relevant."
    - "Inspect what the component actually provides, including boundaries, assumptions, failure modes, and legacy baggage."
    - "Map requirements to capabilities and mark each as FIT, PARTIAL, GAP, or NOT_NEEDED."
    - "Prefer ADOPT or CONFIGURE where fit is good; REDUCE/FORK only where the component is useful but broader than needed; WRITE only for genuine gaps or product-specific behavior."
    - "Do not add compensating architecture merely to make a mismatched component fit. Reject it if the mismatch is structural."
  purpose: "Prevent both greenfield over-design and blind reuse of old Elnath machinery. Make component choice falsifiable against the architecture we actually want."
  current_first_subject: "Elnath Memory Engine / elnath.memory as organizational-memory candidate."
  anti_patterns:
    - "design the whole system from scratch before checking mature/existing blocks"
    - "reuse a previous subsystem because it already exists, without checking current requirements"
    - "treat a component's unused features as requirements"
    - "invent guards/adapters around a structurally poor fit instead of rejecting or reducing the component"


architecture_candidate_v0_1_2026_09_17:
