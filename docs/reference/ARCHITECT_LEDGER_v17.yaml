  likely_implementation_direction_if_fit_is_confirmed: "PostgreSQL remains the main persistence substrate. Reuse/adapt the EME information model and useful retrieval semantics inside the new system rather than adopting the old SQLite implementation or turning EME into a separate service by default."
  explicit_non_decisions:
