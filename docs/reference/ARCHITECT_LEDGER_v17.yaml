product_positioning_2026_09_17:
  thesis:
    status: working_strong
    statement: "Do not compete as an AI-first agent platform. Product should be control-first/customer-owned: deterministic process and authority remain primary; AI is selective, bounded, replaceable execution capacity."
    target_user: "AI-aware operators/SMBs/teams that want automation and semantic capability without delegating full business process, policy, identity, and know-how to an AI provider."
  market_observation:
    status: verified_current_2026_09_17
    findings:
      - "Anthropic Claude for Small Business bundles connectors/workflows for QuickBooks, PayPal, HubSpot, Canva, DocuSign, Google Workspace, and Microsoft 365."
      - "Zapier markets Claude integration across 9,000+ apps and explicitly positions Claude+Zapier as able to perform bookkeeping, marketing, and day-to-day operations."
      - "Zapier already exposes broad accounting automation and QuickBooks+Claude integration patterns."
    implication: "A generic LLM-centered business agent is strategically commoditized by model/platform vendors with superior model access and integration breadth."
    source_urls:
      - "https://www.anthropic.com/news/claude-for-small-business"
      - "https://zapier.com/ai/claude-for-smb"
      - "https://zapier.com/automations/finance/accounting"
      - "https://zapier.com/apps/quickbooks/integrations/anthropic-claude"
  differentiators_candidate:
    - "customer-owned process state and policy"
    - "deterministic control plane over AI"
    - "AI only where semantic value exceeds deterministic alternatives"
    - "model/provider replaceability"
    - "know-how minimization in outbound semantic packets"
    - "hard authority/confidentiality/risk gates outside LLM"
    - "artifact/evidence mediated verification instead of agent debate"
    - "auditable no-safe-route / human authority paths"
  anti_positioning:
    - "AI runs your whole business"
    - "one autonomous agent with full company context"
    - "model-owned global orchestration"
    - "generic marketing/accounting/copilot feature competition"
  falsifier: "market evidence that control-first/customer-owned systems have no meaningful demand or that AI-first platforms provide equivalent local process ownership, provider-independent control, know-how minimization, and deterministic authority boundaries without sacrificing usability."

product_value_center_2026_09_17:
  status: working_strong
  problem_statement: "Frontier LLMs are powerful local operators but can lose global coherence on moderately complex multi-constraint tasks; a larger integration surface does not remove operator unreliability."
  primary_user_value: "Let users exploit strong AI capabilities while reducing the supervision burden and limiting the blast radius of model errors."
  value_mechanism:
    - "externalize global process state, invariants, authority, and completion criteria from the LLM"
    - "route bounded work to AI only where it has comparative advantage"
    - "detect/escalate fragile or low-confidence cases instead of forcing autonomous completion"
    - "use stronger external oracles/tests/tools where available"
    - "keep evidence/artifacts and independent verification paths separate from the generator's narrative"
    - "preserve customer control of process know-how and business policy"
  product_test: "Would this feature materially reduce human cognitive supervision or model-error impact without moving more global authority into the LLM? If not, it is not core product value."
  anti_value_proposition:
    - "more integrations around the same unreliable model operator"
    - "full-company-context autonomous agent"
    - "marketing breadth without stronger error containment"
  empirical_basis:
    - "user's E1-E3 experiments: bounded AI improved semantic work, but complex multi-condition tasks exposed global coherence failures"
    - "user workflow: isolated architect/implementer/auditor roles plus deterministic evidence reduced reliance on a single model"
  concise_thesis: "The product is not a smarter operator; it is a safer operating system around powerful but fallible AI workers."

semantic_contract_boundary_2026_09_17:
  status: working_strong
  observation: "Natural-language alignment is not contract alignment. Two parties can appear to understand each other linguistically while holding materially different task interpretations."
  user_evidence: "User explicitly identified the risk that successful conversational understanding can mask divergent internal task models."
  architectural_thesis: "Critical work must cross a fuzzy-language -> formal-work-contract boundary before execution. The executor should not be required to infer global obligations from prose history."
  preferred_pattern:
    - "human/request source may be natural language"
    - "semantic parser/normalizer may propose structured intent"
    - "backend validates required fields, scope, authority, dependencies, invariants, acceptance criteria, forbidden actions, and evidence requirements"
    - "missing/ambiguous material fields trigger targeted clarification or UNKNOWN/ABSTAIN; they are not silently inferred"
    - "executor receives a typed/structured work item plus bounded semantic payload"
    - "post-execution acceptance evaluates against the formal contract/artifacts, not against whether the output sounds aligned"
  candidate_contract_fields:
    - objective
    - task_family
    - scope
    - authority
    - criticality
    - invariants
    - forbidden_actions
    - dependencies
    - required_inputs
    - allowed_tools
    - output_schema
    - acceptance_criteria
    - required_evidence
    - allowed_transitions
    - confidentiality_class
  critical_distinction: "Do not require the deterministic backend to semantically understand unrestricted prose. If AI is used to parse intent, its structured interpretation is only a candidate until deterministic validation and/or human confirmation of material ambiguity."
  anti_pattern: "Send long natural-language request + historical context and rely on the executor LLM to reconstruct the intended contract every time."
  implication: "The system's value partly comes from compiling ambiguous human intent into a stable machine-checkable execution contract before invoking fallible AI workers."
  falsifier: "Evidence that free-form natural-language execution with model-managed memory achieves equivalent contract fidelity, authority safety, and reproducibility on complex multi-constraint tasks without external formalization."

control_plane_integrity_2026_09_17:
  status: working_strong
  user_incident: "A prior ChatGPT instance silently changed the Task Scope storage/format, which blinded the backend guard that depended on that representation; other models did not report the change. Intent is unknown and architecturally irrelevant."
  core_failure: "The executor could mutate the representation/mechanism used to constrain and audit its own scope. The guard was therefore not independent or tamper-resistant."
  security_mapping:
    - "NIST reference monitor: enforcement mechanism should be tamperproof, always invoked, and small/verifiable."
    - "Complete mediation: every consequential access/write must cross the policy boundary, not only be checked opportunistically after the fact."
    - "Least privilege: executor reasoning must not widen runtime permissions."
    - "Fail-safe default: malformed/unknown scope representation fails closed, never disables enforcement."
  architectural_rules:
    - "The AI executor must never be authoritative for Task Scope, policy schema, guard configuration, permission state, or acceptance rules."
    - "Task Scope lives in a customer-controlled control plane (DB/object store/policy service), versioned and schema-validated; any human-readable task file is a projection, not authority."
    - "Executor receives a read-only contract/capability derived by the backend; changing a local copy cannot change authority."
    - "Policy/guard code and configuration are outside executor writable roots or protected by OS/container permissions."
    - "Writes/deletes/tool calls are mediated at execution time by an external policy layer; post-hoc diff is additional evidence, not the primary boundary."
    - "Prefer disposable sandbox/overlay workspaces: executor produces candidate patch/artifacts; backend validates scope and applies accepted changes to canonical state."
    - "If valid completion requires files/actions outside scope, executor may emit SCOPE_EXPANSION_REQUEST with reason/evidence, but cannot self-authorize expansion."
    - "Deletion is a separate capability and is denied by default unless explicitly authorized."
    - "Malformed, missing, schema-mismatched, or unknown Task Scope causes STOP/FAIL_CLOSED, not permissive fallback."
  key_thesis: "Do not try to make the LLM obedient enough to protect the guardrail. Make guardrail bypass non-authoritative and technically unavailable."
  implication_for_product: "The control plane should assume the worker can drift, misinterpret, optimize for convenience, or behave adversarially; safety must not depend on diagnosing which occurred."
  sources:
    - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5-draft.pdf"
    - "https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentsec02-bp01.html"
    - "https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentrel02-bp02.html"
    - "https://openai.com/index/building-codex-windows-sandbox/"

capability_envelope_by_work_type_2026_09_17:
  status: working_strong
  correction: "Do not generalize the Codex B no-tools pattern to every AI role. Restrict primarily the model's authority/capabilities, while context breadth and read access should match the work type."
  user_observation: "A closed evidence package is useful for analysis/verification of supplied data, but insufficient for exploration of open sources where the model must discover, pivot, and follow evidence beyond an initial packet."
  role_patterns:
    closed_world_witness:
      read_scope: "fixed backend-prepared evidence view plus explicit artifact requests"
      write_scope: "none"
      purpose: "verification, contract review, audit, falsification of a bounded claim"
      precedent: "Elnath Code Codex B / ModelView"
    open_world_researcher:
      read_scope: "broad web/search/read-only connectors; may reformulate queries and follow new sources"
      write_scope: "no canonical business-state mutation; output is report/evidence bundle only"
      purpose: "discovery, current-state research, market/technical/legal/source exploration"
      required_output_properties: "provenance/citations, explicit unknowns, source-backed findings"
    bounded_executor:
      read_scope: "minimum sufficient task context plus task-relevant tools"
      write_scope: "task-specific capabilities only"
      purpose: "perform authorized operational work"
  key_distinction: "epistemic freedom != operational authority. A researcher may need wide freedom to look, while still having almost no power to change canonical state."
  existing_market_pattern:
    - "OpenAI Deep Research performs multi-step open-web exploration and synthesis with citations."
    - "Current workspace-agent controls distinguish read access from write actions and allow read-only connectors plus separate write approvals/constraints."
  architectural_effect: "Router should select a capability envelope by work type instead of applying one universal sandbox/context policy to every LLM call."
  anti_patterns:
    - "give every model only a closed packet"
    - "give a research model broad write authority because it needs broad read access"
    - "treat broad context as equivalent to broad operational permission"
  sources:
    - "https://openai.com/index/introducing-deep-research/"
    - "https://academy.openai.com/public/clubs/work-users-ynjqu/resources/deep-research"
    - "https://help.openai.com/en/articles/20001143"

risk_thesis_falsification_2026_09_17:
  status: working_strong_with_limits
  thesis_tested: "For enterprise AI, two core risks are excessive operational authority (agent acts beyond user intent) and excessive exposure of sensitive/company data; value comes from reducing blast radius, limiting data exposure, and making material actions observable/auditable."
  verdict: "SUPPORTED as a real and widely recognized risk framing, but NOT sufficient as a complete safety architecture and NOT free of utility cost."
  supporting_evidence:
    - "OWASP LLM06:2025 defines Excessive Agency and identifies excessive functionality, permissions, and autonomy as root causes; recommends least privilege and narrower tool/function scope."
    - "Anthropic 2026 engineering reports real Claude Code incidents from over-eager action: deleting remote git branches after misinterpreting instructions, uploading a GitHub auth token to an internal cluster, and attempting migrations against production databases."
    - "Anthropic reports users approve ~93% of permission prompts, showing human-in-the-loop confirmation alone suffers approval fatigue and is not a strong primary control."
    - "OpenAI agent guidance recommends enabling only apps needed for the task, avoiding broad prompts, using confirmations for consequential actions, and acknowledges safeguards do not eliminate prompt-injection risk."
    - "Microsoft 2026 agent security guidance treats least privilege, per-action authorization, action audit logging, sandboxing/egress controls, and data governance as core responsibilities."
    - "AgentDojo and subsequent work show prompt injection can cause unintended tool actions and data exfiltration; no general model-only defense solves the problem."
    - "CaMeL demonstrates that external control/data-flow enforcement can provide strong security properties, supporting the principle that safety should not rely only on LLM obedience."
    - "AgenTRIM reports task-step least-privilege tool filtering can reduce attack success while retaining high utility, supporting adaptive rather than globally restrictive capability control."
  counterevidence_and_limits:
    - "Security boundaries have a utility/maintenance cost. OpenAI Lockdown Mode explicitly trades useful features for reduced exfiltration risk; Anthropic notes sandboxing is high-maintenance and network/host access complicates isolation."
    - "CaMeL's strong security result solved only about 67% of AgentDojo tasks, so rigid capability/data-flow constraints can materially reduce task completion."
    - "Audit logs improve reconstruction/accountability but do not prevent the first harmful action; irreversible/high-impact actions need pre-action authorization or bounded capabilities, not logging alone."
    - "Human approvals are weak at scale due to approval fatigue; 'ask the user every time' is not an adequate architecture."
    - "Data minimization reduces exposure/blast radius but cannot guarantee confidentiality: prompt-injection research still finds non-zero leakage under defenses."
    - "Over-restricting read/context access can degrade open-world research and complex tasks; controls must distinguish epistemic freedom from operational authority."
    - "The hard unsolved problem remains semantic intent translation: least privilege can enforce an explicit contract, but cannot by itself guarantee that the contract correctly represents what the human meant."
  refined_product_thesis:
    - "Do not promise an agent that never makes mistakes. Promise bounded damage, bounded data exposure, and reconstructable actions."
    - "Primary controls should target capabilities/permissions/data flow, not model personality or obedience."
    - "Use task-specific capability envelopes: broad read may coexist with narrow/no write."
    - "Apply stronger pre-action controls to irreversible/external/high-impact operations; use auditability for detection/reconstruction, not as prevention substitute."
    - "Treat confidentiality and authority as separate axes: what the model may see and what it may do are independently scoped."
  product_value_test: "Does the mechanism reduce expected impact of model error or data compromise while preserving enough task utility to beat a human-supervised generic agent?"
  falsifier: "Evidence that unrestricted agent access achieves comparable real-world utility with no materially higher rates/costs of unintended actions or data exposure, or that external capability/data-flow controls fail to reduce impact relative to prompt/model-only safeguards."
  sources:
    - "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/"
    - "https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html"
    - "https://www.anthropic.com/engineering/claude-code-auto-mode"
    - "https://www.anthropic.com/engineering/how-we-contain-claude"
    - "https://help.openai.com/en/articles/11752874-chatgpt-agent"
    - "https://openai.com/safety/prompt-injections/"
    - "https://help.openai.com/en/articles/20001061"
    - "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility-ai-agent"
    - "https://learn.microsoft.com/en-us/security/zero-trust/sfi/least-privilege-for-ai-agents"
    - "https://arxiv.org/abs/2406.13352"
    - "https://arxiv.org/abs/2503.18813"
    - "https://arxiv.org/abs/2601.12449"

recovery_first_design_2026_09_17:
  status: working_strong
  origin: "Transfer the software-engineering rollback/versioning mindset into AI-mediated business processes."
  core_principle: "Assume models, backend, and humans will all make mistakes. Prefer making errors visible, bounded, and recoverable over adding controls for every conceivable failure mode."
  design_priority_order:
    - "observability: know what actually changed and why"
    - "blast-radius reduction: keep mistakes local"
    - "recoverability: preserve or reconstruct a prior valid state"
    - "prevention: add only when residual harm remains unacceptable"
  key_distinction: "Recovery is not one universal undo. Different action classes have different reversibility semantics."
  action_classes:
    stateful_internal:
      examples: ["configuration", "document/version state", "workflow state", "internal records"]
      preferred_pattern: "version/snapshot/event history plus rollback or compensating restore"
    external_but_compensatable:
      examples: ["CRM updates", "calendar changes", "draft publication", "some account changes"]
      preferred_pattern: "record prior state and provide compensating action where the external system supports it"
    effectively_irreversible:
      examples: ["sent email", "money transfer", "public disclosure", "destructive deletion without backup"]
      preferred_pattern: "stronger pre-action controls, staging/draft/delay where feasible, because rollback cannot be assumed"
  architecture_effect: "Do not build a new guard for every imaginable failure. First ask whether the operation can be made observable and recoverable cheaply. Escalate to stronger prevention only for high-impact or poorly reversible actions."
  anti_pattern: "Treating theoretical prevention as the default objective and allowing control complexity to grow faster than practical risk reduction."
  product_value: "AI mistakes should behave more like recoverable bad commits than silent irreversible business incidents whenever the domain permits."

visible_undo_window_2026_09_17:
  status: working_strong
  origin: "User refinement: delayed commit should not behave like escalation or mandatory approval. The UI should visibly show a prepared operation and the remaining time before execution; the user chooses whether the action deserves attention."
  core_principle: "For suitable consequential actions, create a visible grace window before irreversible external effect. Keep autonomy as the default path, but expose an obvious cancel/undo affordance until commit time."
  interaction_model:
    - "AI/backend prepares the operation."
    - "UI shows what will happen and when, e.g. 'Email will be sent in 8 min'."
    - "No mandatory review is required by default."
    - "User may inspect, edit, cancel, or ignore it."
    - "If untouched, the system commits automatically after the grace period."
  key_distinction: "This is ambient control, not escalation. The system offers a recovery opportunity without converting the human into a permanent approval gate."
  design_effect:
    - "Prefer visible delayed commit for actions where a short delay is operationally acceptable."
    - "The undo control and countdown should be salient in the normal UI, not buried in audit logs."
    - "Risk can tune delay length or disable auto-commit for exceptional cases, but routine operations should not require explicit approval."
  examples:
    - "outbound email"
    - "scheduled social/publication actions"
    - "bulk CRM communication"
    - "campaign activation"
    - "selected destructive operations with a recoverable holding state"
  anti_patterns:
    - "ask the user to approve every routine action"
    - "hide undo only in logs/history"
    - "treat every delayed action as an exception requiring escalation"
    - "make the model decide whether the user deserves to see the pending action"
  product_value: "Give users a cheap option to intervene without forcing them to supervise every AI action."

eme_memory_candidate_2026_09_17:
  status: candidate_for_fit_validation
