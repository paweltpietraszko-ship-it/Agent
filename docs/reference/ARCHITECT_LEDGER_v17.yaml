next_research:
  priority_1: "falsify H012: task-family classification without opaque central LLM"
  priority_2: "test H015 boundary: define dependency closure / sufficient-context contract without giving worker global process know-how"
  priority_3: "map production OSS/control-plane components for deterministic risk policy + dependency-aware state + durable workflow + acceptance"

empirical_observations_2026_09_16:
  E1_semantic_extraction:
    status: observed
    result_summary:
      deterministic_arm: "20/28"
      deepseek_semantic_arm: "28/28"
      gemini_flash_replication: "28/28"
    architectural_observation: "Bounded semantic AI can materially outperform deterministic handling on interpretation/normalization tasks when scope is narrow and outputs are structured."
    architectural_effect: "Preserve deterministic control, but route semantic ambiguity to bounded AI rather than forcing brittle rule expansion."
    caveat: "Does not justify model ownership of workflow, authority, or side effects."

  E2_identity_binding:
    status: observed
    result_summary:
      total_cases: 32
      deterministic_final: 17
      routed_to_ai_semantic: 15
      false_match: 0
      false_no_match: 0
      ai_semantic_correct: "15/15"
      combined: "32/32"
    architectural_observation: "PROGRAM-first routing plus bounded AI fallback worked better than either universal deterministic logic or universal AI."
    architectural_effect: "Strong evidence for layered routing: deterministic path first where rules are sufficient, semantic fallback where evidence is incomplete/ambiguous."
    human_oracle_observation: "A human with the same insufficient evidence is not automatically a stronger oracle than the model. Escalate to human only when human can access new evidence or holds required authority."

  E3_governed_learning:
    status: observed_pass
    purpose: "Test whether repeated corrections can reduce future human cognitive work without silently turning model behavior into business policy."
    arm_a_deterministic:
      class_correct: "16/40"
      abstain: 24
      wrong_concrete_class: 0
    arm_b_gemini:
      class_correct: "28/40"
      abstain: 12
      wrong_concrete_class: 0
      per_class_correct:
        A: "7/7"
        B: "4/7"
        C: "4/8"
        D: "4/9"
        E: "9/9"
    architectural_observation: "A bounded model can reduce review load substantially while preserving safety when its only allowed unsafe alternative is abstention rather than autonomous promotion/authority changes."
    utility_effect: "Human review requirement reduced by 50% versus conservative deterministic arm (24 -> 12 abstentions) with zero wrong concrete class substitutions."
    governance_effect: "Learning must remain transfer-of-responsibility under explicit backend governance; repetition is not authority and model pattern recognition is not policy promotion."

  cross_test_findings:
    CT001:
      finding: "The useful boundary is not PROGRAM versus AI globally, but case-level routing between deterministic competence and semantic competence."
      status: working_strong
    CT002:
      finding: "ABSTAIN is a safety valve, but utility must be measured; universal abstention would pass safety and fail product value."
      status: working_strong
    CT003:
      finding: "Human escalation is only rational when the human contributes new evidence, privileged context, or authority; otherwise it may be a ceremonial handoff."
      status: working_strong
    CT004:
      finding: "Model correctness on bounded tasks does not imply reliability on long/compound tasks; the system must decompose work and keep global state/control outside the model."
      status: working_strong
    CT005:
      finding: "Observed model failures on complex tasks (including DeepSeek/Grok in user-run tests) support treating long, compound reasoning as higher-risk than bounded semantic subtasks."
      status: anecdotal_user_evidence
      caution: "Use as architectural signal, not standalone statistical proof."
    CT006:
      finding: "Empirical capability profiles should be derived from held-out outcomes per task class rather than model self-confidence."
      status: working_strong

  model_role_implication:
    architect: "Define contracts, decomposition, routing policy, falsification targets."
    implementer: "Produce artifact under explicit task contract."
    auditor: "Try to falsify artifact independently; findings are evidence, not authority."
    oracle: "Prefer deterministic/external evidence where available."
    owner: "Retains product/architecture authority and resolves decisions that cannot be delegated safely."


architecture_notes:
  ANCHORING_001:
    status: working_strong
    statement: "Critical goals/invariants must not rely on passive persistence in long conversational context; they should be externalized and re-injected from canonical process state at each relevant work item."
    rationale:
      - "Long-context systems suffer context pollution/salience decay even when tokens remain technically present."
      - "Long-horizon harnesses benefit from structured note-taking, compaction, checkpoints, and explicit state handoff."
    preferred_pattern:
      - "canonical process state outside LLM"
      - "minimal per-work-item contract capsule: objective + invariants + authority + acceptance criteria + required evidence + allowed transitions"
      - "re-inject capsule near/current task at every consequential step"
      - "hard backend/tool gates for non-negotiable constraints"
      - "checkpoint/resume from canonical state, not chat recollection"
    anti_patterns:
      - "repeat full constitution in every prompt"
      - "rely on one early instruction remaining salient across long trajectory"
      - "use conversation summary as sole source of truth"
      - "let model self-certify that it still remembers critical constraints"
    evidence:
      - "Anthropic Effective Context Engineering for AI Agents: context is finite attention budget; recommends minimal high-signal context, just-in-time retrieval, compaction, structured note-taking."
      - "Anthropic Effective Harnesses for Long-Running Agents: compaction alone insufficient; use persistent artifacts and incremental sessions."
      - "OpenAI Agents SDK 2026: externalized state/snapshots/rehydration for long-running tasks."
    source_urls:
      - "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
      - "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
      - "https://openai.com/pl-PL/index/the-next-evolution-of-the-agents-sdk/"
    falsifier: "evidence that passive one-time instructions retain equivalent compliance across long trajectories without external refresh/control"

  CONTEXT_HYGIENE_001:
    status: working_strong
    statement: "Long-lived agent sessions need not degrade monotonically if completed work is compacted/trimmed and durable state is externalized; session lifetime is not equivalent to active context-window size."
    user_evidence:
      observation: "One Claude Code instance has remained active for >2 weeks, produced thousands of lines of code and many fixes, and survived handoffs across 3 ChatGPT architect instances and 3 Codex auditor instances without an observed rise in bug frequency/quality degradation."
      strength: anecdotal_but_high_value_operational_evidence
      caveat: "Absence of observed degradation is not proof of no hidden drift; use tests/defect rates/rollback history if later quantification is needed."
    research_support:
      - "Anthropic explicitly distinguishes session lifetime from a single model context window; managed long-horizon agents use compaction, memory/files, and context trimming."
      - "Claude Code/Agent SDK supports compaction for long-running tasks, but Anthropic also reports that compaction alone can be insufficient in some model/harness regimes; resets plus handoff artifacts can outperform compaction-only."
      - "Anthropic 2026 postmortem showed broken context-management flags caused forgetfulness/repetition/odd tool choices, indicating context-management quality itself can materially affect agent quality."
    architectural_effect:
      - "Treat context as a hot working set, not permanent history."
      - "Completed tasks should leave hot context after producing durable receipts/artifacts/summaries."
      - "Keep canonical state and important artifacts outside the context window; rehydrate only what the current work item needs."
      - "Prefer compaction/trimming/reset policies based on observable state boundaries rather than arbitrary session age."
      - "Do not force session restart merely because it is old if empirical quality remains stable and canonical state is sound."
    candidate_storage_tiers:
      hot: "current work item + contract capsule + immediately relevant evidence"
      warm: "recent unresolved dependencies / active branch state / short summaries"
      cold: "completed task receipts, historical findings, old tool outputs, superseded discussion"
    anti_patterns:
      - "retain all completed-task transcripts in active context"
      - "equate a multi-day session with one uncompressed context window"
      - "restart agents on fixed elapsed-time schedule without evidence of degradation"
      - "trust compaction summary as sole canonical history when source artifacts can be preserved"
    source_urls:
      - "https://www.anthropic.com/engineering/managed-agents"
      - "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
      - "https://www.anthropic.com/engineering/harness-design-long-running-apps"
      - "https://www.anthropic.com/engineering/april-23-postmortem"
    falsifier: "controlled evidence that long-lived compacted sessions exhibit systematic quality decay independent of task mix, model/version, and context-management implementation"


