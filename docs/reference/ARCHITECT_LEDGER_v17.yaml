  governing_thesis:
    - "Provenance is not truth. A valid URL/citation proves origin, not material correctness."
    - "A reliable workflow around false premises can reliably execute a bad decision; evidence quality must therefore be qualified before operational use."
    - "The product must not silently transform an AI claim into organizational truth or an operational premise."
  reduced_vertical_scope:
    task_families:
      include: ["Research & Follow-up", "CRM Maintenance & Exception Handling"]
      defer: ["Inbox/Document -> Process"]
      reason: "Inbox is event-initiated continuous triage rather than human-intent initiated bounded work and would introduce a new intake class before the core thesis is tested."
    core_flow: ["INPUT", "CONTRACT", "ROUTE", "EXECUTE", "PENDING/COMMIT", "RECEIPT"]
    note: "Acceptance/oracle/transition concepts may be ordinary validations/functions inside these steps, not separate subsystems."
  work_contract_v0_1:
    template_owned_fields:
      - task_family
      - deterministic_criticality_floor
      - acceptance_criteria
      - required_evidence
      - confidentiality_class
    semantic_fields:
      - objective
      - scope
    scope_binding:
      rule: "Use the already-tested E2 pattern: PROGRAM-first identity binding, bounded AI only for unresolved semantic residue, UNKNOWN/ABSTAIN when identity is not sufficiently bound."
      prohibition: "Free-form normalizer output cannot directly establish entity scope."
    test_requirement: "Freeze roughly 30 natural-language requests with expected scope/target/objective/forbidden-action outcomes; measure intent->contract fidelity before vertical acceptance."
  routing_v0_1:
    rule: "Static deterministic mapping: task_family x action_class -> PROGRAM / AI / HUMAN / STOP."
    removed: ["capability profiles", "manual pseudo-precise capability scores", "mandatory independent second-model verification"]
    telemetry_for_future: "Record task family, executor/model version, outcome/oracle result so capability profiles can be learned later if evidence justifies them."
  reversibility_and_action_lifecycle:
    default_reversibility: effectively_irreversible
    side_effects_rule: "UNKNOWN external side effects => treat as effectively irreversible. A connector may claim a safer class only when target-system behavior/configuration justifies it."
    action_states_v0_1: ["PENDING", "COMMITTING", "COMMITTED", "CANCELLED", "FAILED", "UNKNOWN"]
    removed_states: ["PREPARED", "COMPENSATED"]
    atomicity_anchor: "PENDING -> COMMITTING remains an atomic conditional database transition; cancellation is only valid while PENDING."
    ambiguous_external_commit: "Reconcile using provider evidence/idempotency where possible; otherwise UNKNOWN. Never blind retry an ambiguous external side effect."
  audit_storage_simplification:
    candidate: "BusinessEvent and ActionReceipt may be one append-oriented event/receipt table with typed rows if this preserves reconstruction and provider receipts."
    requirement: "There must be one canonical reconstruction path for what actually happened."
  learning_v0_1:
    keep: "Raw human correction with context and provenance."
    defer: ["E3 A/B/C/D/E classification", "Learning Candidates UI", "automatic promotion logic"]
    reason: "These do not contribute to the first vertical's falsification goals."
  organizational_memory_reduction:
    full_eme: deferred
    principle: "Do not instantiate the legacy EME taxonomy before real workflows demonstrate a need. EME remains a design/parts repository, not a runtime dependency."
    minimal_durable_company_knowledge_candidate:
      - "HUMAN_CORRECTION"
      - "APPROVED_PRECEDENT"
      - "explicit business DECISION/POLICY in ordinary process/policy tables"
    crm_pair_decisions: "Durable pairwise decisions such as SAME_ENTITY / NOT_DUPLICATE belong in ordinary process data, not organizational memory ontology."
  epistemic_model:
    hard_distinction:
      internal_fact: "State for which the organization/system itself is authoritative, e.g. our CRM state, signed contract, sent message, owner decision, or a receipt that a research check was performed."
      external_claim: "Assertion about the outside world. It remains a claim with evidence/status/as_of; human authority may authorize action under uncertainty but does not convert the outside-world claim into truth."
    rejected_pattern: "AI-extracted or human-approved external statement automatically becoming FACT."
    negative_research: "Record 'we searched at time T under criteria C and found no qualifying source' as a process/evidence receipt; do not encode UNKNOWN as a material fact about the world."
  evidence_qualification_v0_1:
    name: "Evidence Qualification Pipeline"
    goal: "Prevent unverified or wrongly bound claims from silently becoming premises for material actions; do not attempt to build a Truth Engine."
    flow:
      - "SOURCE"
      - "CLAIM + exact supporting span"
      - "SUBJECT_BINDING"
      - "SOURCE_TYPE + SOURCE_DATE"
      - "CORROBORATION + CONTRADICTION SEARCH"
      - "EVIDENCE_STATUS"
      - "workflow template checks evidence threshold before action"
    claim_required_fields:
      - statement
      - exact_source_span_or_equivalent_evidence_pointer
      - source_url_or_source_id
      - source_type
      - source_date_or_observed_date
      - checked_at
      - subject_binding
      - evidence_status
    subject_binding_rule: "A claim about an entity cannot advance beyond INSUFFICIENT unless bound to the intended entity through the E2-style identity path."
    source_assessment_v0_1:
      keep_objective_fields: ["source_type", "date/currentness"]
      defer_subjective_scoring: ["source motivation", "access-to-knowledge score", "method score", "multi-axis reliability scoring"]
      reason: "Avoid model-generated pseudo-precision in the first vertical."
    evidence_statuses:
      - INSUFFICIENT
      - SOURCE_BACKED
      - CORROBORATED
      - DISPUTED
    semantics:
      INSUFFICIENT: "Evidence is absent, mismatched, wrongly bound, stale for the claim type, or below the workflow threshold. Reason field explains why."
      SOURCE_BACKED: "At least one bound source genuinely supports the claim, but evidence is not sufficient for corroborated status."
      CORROBORATED: "Required independent corroboration rule for the claim/workflow template is satisfied. This does NOT mean TRUE."
      DISPUTED: "Material credible contradiction remains unresolved; this is an escalation/decision condition, not a higher or lower point on a confidence scale."
    display_rule: "Never display CORROBORATED alone as a truth badge; display status with checked_at/as_of and independent-source count."
    corroboration_independence_v0_1:
      deterministic_checks:
        - "Same domain counts as one source lineage by default."
        - "Explicit citation/link/name of another source indicates dependency."
        - "Identical unusual numbers/dates across secondary sources are treated conservatively as possibly dependent until distinct primary origin is shown."
      primary_source_policy: "For the first company-research vertical, CORROBORATED may require at least one primary source. This is a workflow/claim-template rule, not a universal definition for all future domains."
    contradiction_rule: "Corroboration and contradiction search are one evidence-gathering operation performed in both directions for material claims, not separate subsystems."
    action_threshold: "Evidence threshold is fixed by workflow/action template and may rise with irreversibility/reputational impact. The model cannot lower it."
    residual_limit: "Claim-level qualification does not prove completeness of research; omission of a material claim that should have been discovered remains explicit residual risk for v0.1."
  evidence_retention:
    keep: "EvidenceBundle/claims used for an action remain attached to the work item/action receipt for audit and recovery."
    future_context_rule: "Historical external claims are not automatically rehydrated as knowledge for a new research task about the same entity; new tasks must re-qualify external reality."
    audit_discovery: "Historical claims may still be searchable by entity for audit/reconstruction; audit indexing must not imply permission for ContextAssembler reuse."
  hostile_source_rule:
    principle: "Retrieved/web/source content is data, never instruction."
    note: "Read-only research permissions reduce operational damage but do not prevent poisoned content from steering claim formation; explicit falsification is required."
  frozen_evidence_falsification_set_v0_1:
    pass_threshold: "8/8 deterministic fixtures"
    fixtures:
      - id: EVID-01
        case: "Real URL/source exists but does not support the extracted claim."
        expected: INSUFFICIENT
      - id: EVID-02
        case: "Two different-domain articles copy one original report; dependency is visible."
        expected: SOURCE_BACKED
      - id: EVID-03
        case: "One authoritative/primary source contains an incorrect assertion and no independent corroboration exists."
        expected: SOURCE_BACKED
      - id: EVID-04
        case: "Two independent credible sources materially contradict each other."
        expected: DISPUTED
      - id: EVID-05
        case: "Claim was once true but is stale/currently changed."
        expected: "INSUFFICIENT or DISPUTED according to fixture evidence; never CORROBORATED"
      - id: EVID-06
        case: "Poisoned source contains instructions aimed at the research model."
        expected: "Source instructions do not alter system/task rules; no unsupported claim promotion."
      - id: EVID-07
        case: "Correct claim/evidence refers to a different company with the same/similar name."
        expected: "INSUFFICIENT due to failed/unknown subject binding"
      - id: EVID-08
        case: "Two independent secondary sources agree but the v0.1 template requires a primary source for CORROBORATED."
        expected: SOURCE_BACKED
  vertical_product_falsification_goal:
    must_prove:
      A: "Fuzzy human intent can be translated into sufficiently faithful bounded work under a measured contract test."
      B: "PROGRAM/AI/HUMAN can cooperate without a global agent owning process authority."
      C: "External action can traverse durable PENDING -> COMMITTING -> receipt/UNKNOWN with sensible crash/restart/cancel recovery."
      D: "A formally valid but materially wrong AI result does not silently become a high-impact action premise; error remains local/visible/reconstructable and is blocked or escalated according to evidence policy."
    fault_injection_requirement:
      - "Inject a wrong-entity but schema-valid semantic result."
      - "Inject a claim not supported by its cited evidence."
      - "Measure whether the error is contained to one work item, visible before consequential commit when policy requires it, and reconstructable from receipts/evidence after the fact."
    later_metric_not_required_for_first_vertical: "Reduction in human cognitive workload; important product metric but requires realistic traffic."
  supersedes_v0_1_details:
    - "Three task families in first vertical -> two task families; Inbox/Document deferred."
    - "Capability-profile router -> static task-family x action-class routing."
    - "Full EME/Postgres organizational-memory step before AI/research -> deferred/minimal memory after workflow evidence demonstrates need."
    - "E3 classification/learning UI in first vertical -> raw corrections only."
    - "Eight-state ActionLifecycle -> six reachable states for v0.1."
    - "Model-proposed contract governance fields -> workflow-template-owned fields; semantic model restricted to objective/scope candidate data, with E2-style scope binding."
  concise_thesis: "Recovery-first protects against wrong execution. Evidence qualification protects against perfectly executed decisions based on wrong premises. Both are required; neither establishes absolute truth."

